services:
  frontend-dev:
    image: nginx:alpine
    container_name: libreria-estudio-frontend-dev
    command:
      - /bin/sh
      - -c
      - |
        sed -i -E 's|/var/run/nginx\.pid|/tmp/nginx.pid|g; s|/run/nginx\.pid|/tmp/nginx.pid|g' /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./src:/usr/share/nginx/html/src:ro
      - ./public:/usr/share/nginx/html/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - frontend-dev-net

networks:
  frontend-dev-net:
    driver: bridge
