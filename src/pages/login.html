<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Librería Estudio</title>
  <link rel="icon" type="image/svg+xml" href="../../src/assets/images/favicon.svg">
  <link rel="stylesheet" href="../../src/assets/css/variables.css">
  <link rel="stylesheet" href="../../src/assets/css/reset.css">
  <link rel="stylesheet" href="../../src/assets/css/base.css">
  <link rel="stylesheet" href="../../src/assets/css/layout.css">
  <link rel="stylesheet" href="../../src/assets/css/hero-scroll.css">
  <link rel="stylesheet" href="../../src/assets/css/components.css">
  <link rel="stylesheet" href="../../src/assets/css/pages.css">
</head>
<body data-page="login">
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  <header id="navbar-root"></header>

  <main id="main-content">
    <section class="section">
      <div class="container auth-wrap">
        <form id="login-form" class="card" novalidate>
          <h1>Iniciar Sesión</h1>
          <p class="text-sm">Accede a tus listas escolares guardadas, direcciones y pedidos.</p>

          <div class="form-group">
            <label for="login-email" class="form-label">Correo electrónico</label>
            <input id="login-email" name="email" class="form-input" type="email" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label">Contraseña</label>
            <input id="login-password" name="password" class="form-input" type="password" required autocomplete="current-password">
          </div>

          <p id="auth-feedback" class="form-error" role="alert"></p>

          <button class="btn btn--primary btn--full" type="submit">Entrar</button>

          <div class="section__header--row">
            <a class="navbar__link" href="./forgot-password.html">¿Olvidaste tu contraseña?</a>
            <a class="navbar__link" href="./register.html">Crear cuenta</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer id="footer-root"></footer>
  <div id="cart-drawer-root"></div>
  <div id="cookie-banner-root"></div>
  <div id="cookie-modal-root"></div>
  <div id="help-widget-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="../../src/main.js"></script>
</body>
</html>
