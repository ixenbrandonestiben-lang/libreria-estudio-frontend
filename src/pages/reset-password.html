<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña | Librería Estudio</title>
  <link rel="icon" type="image/svg+xml" href="../../src/assets/images/favicon.svg">
  <link rel="stylesheet" href="../../src/assets/css/variables.css">
  <link rel="stylesheet" href="../../src/assets/css/reset.css">
  <link rel="stylesheet" href="../../src/assets/css/base.css">
  <link rel="stylesheet" href="../../src/assets/css/layout.css">
  <link rel="stylesheet" href="../../src/assets/css/hero-scroll.css">
  <link rel="stylesheet" href="../../src/assets/css/components.css">
  <link rel="stylesheet" href="../../src/assets/css/pages.css">
</head>
<body data-page="reset-password">
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  <header id="navbar-root"></header>

  <main id="main-content">
    <section class="section">
      <div class="container auth-wrap">
        <form id="reset-form" class="card" novalidate>
          <h1>Restablecer Contraseña</h1>
          <p class="text-sm">Ingresa tu nueva contraseña (mínimo 8 caracteres, con letras y números).</p>

          <div class="form-group">
            <label for="reset-token" class="form-label">Token de recuperación</label>
            <input id="reset-token" name="token" class="form-input" type="text" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="reset-password" class="form-label">Nueva contraseña</label>
            <input id="reset-password" name="newPassword" class="form-input" type="password" required minlength="8" autocomplete="new-password">
          </div>

          <p id="auth-feedback" class="text-sm" role="status"></p>

          <button class="btn btn--primary btn--full" type="submit">Actualizar contraseña</button>
          <a class="navbar__link" href="./login.html">Volver a iniciar sesión</a>
        </form>
      </div>
    </section>
  </main>

  <footer id="footer-root"></footer>
  <div id="cart-drawer-root"></div>
  <div id="cookie-banner-root"></div>
  <div id="cookie-modal-root"></div>
  <div id="help-widget-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="../../src/main.js"></script>
</body>
</html>
