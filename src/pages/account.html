<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta y Direcciones | Librería Estudio</title>
  <link rel="icon" type="image/svg+xml" href="../../src/assets/images/favicon.svg">
  <link rel="stylesheet" href="../../src/assets/css/variables.css">
  <link rel="stylesheet" href="../../src/assets/css/reset.css">
  <link rel="stylesheet" href="../../src/assets/css/base.css">
  <link rel="stylesheet" href="../../src/assets/css/layout.css">
  <link rel="stylesheet" href="../../src/assets/css/hero-scroll.css">
  <link rel="stylesheet" href="../../src/assets/css/components.css">
  <link rel="stylesheet" href="../../src/assets/css/pages.css">
</head>
<body data-page="account">
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  <header id="navbar-root"></header>

  <main id="main-content">
    <section class="page-header">
      <div class="container section__header--row">
        <div>
          <h1>Mi Cuenta</h1>
          <p id="account-user-summary" class="text-sm"></p>
        </div>
        <div class="navbar__actions">
          <a class="btn btn--outline btn--sm" href="./orders.html">Mis Pedidos</a>
          <button id="logout-btn" class="btn btn--danger btn--sm" type="button">Cerrar sesión</button>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container two-col-layout">
        <div>
          <h2>Mis Direcciones de Entrega</h2>
          <div id="addresses-list-root" class="grid"></div>
        </div>

        <form id="address-form" class="card" novalidate>
          <h2>Agregar nueva dirección</h2>
          <div class="form-group">
            <label for="addr-label" class="form-label">Alias (Casa, Escuela, Oficina)</label>
            <input id="addr-label" name="label" class="form-input" type="text" required>
          </div>
          <div class="form-group">
            <label for="addr-recipient" class="form-label">Persona que recibe</label>
            <input id="addr-recipient" name="recipient" class="form-input" type="text" required>
          </div>
          <div class="form-group">
            <label for="addr-street" class="form-label">Calle, número y colonia</label>
            <input id="addr-street" name="street" class="form-input" type="text" required>
          </div>
          <div class="grid grid--2">
            <div class="form-group">
              <label for="addr-city" class="form-label">Ciudad</label>
              <input id="addr-city" name="city" class="form-input" type="text" required>
            </div>
            <div class="form-group">
              <label for="addr-cp" class="form-label">Código postal</label>
              <input id="addr-cp" name="postalCode" class="form-input" type="text" maxlength="5" required>
            </div>
          </div>
          <div class="form-group">
            <label for="addr-phone" class="form-label">Teléfono</label>
            <input id="addr-phone" name="phone" class="form-input" type="tel" required>
          </div>
          <p id="address-error" class="form-error" role="alert"></p>
          <button class="btn btn--primary btn--full" type="submit">Guardar dirección</button>
        </form>
      </div>
    </section>
  </main>

  <footer id="footer-root"></footer>
  <div id="cart-drawer-root"></div>
  <div id="cookie-banner-root"></div>
  <div id="cookie-modal-root"></div>
  <div id="help-widget-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="../../src/main.js"></script>
</body>
</html>
