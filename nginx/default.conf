server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Deshabilitar listado de directorios
    autoindex off;

    # Cabeceras de seguridad
    include /etc/nginx/snippets/security-headers.conf;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/manifest+json;

    # Endpoint de salud para Docker / Dokploy
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # Bloquear acceso a archivos y directorios ocultos (.git, .env, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Servir archivos SEO/PWA desde raíz o desde /public/
    location ~ ^/(robots\.txt|sitemap\.xml|manifest\.json)$ {
        try_files $uri /public$uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Evitar caché agresiva en archivos HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Caché prolongada para recursos estáticos
    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Fallback para rutas de la aplicación
    location / {
        try_files $uri $uri/ /index.html;
    }
}
